openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: The Sweetest Scoop party game API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sweetest-scoop
    description: Persistent multiplayer game rooms
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /practice/answer:
    post:
      operationId: checkPracticeAnswer
      tags: [sweetest-scoop]
      summary: Check a practice answer against the prepared bank without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeAnswerInput"
      responses:
        "200":
          description: Checked answer. matched is false with zero points when the answer is not listed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerReward"
        "400":
          description: Malformed practice request
  /rooms:
    post:
      operationId: createRoom
      tags: [sweetest-scoop]
      summary: Create a room and host session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomInput"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRoom"
        "400":
          description: Invalid host name, appearance, or pasted questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEntryProblem"
        "503":
          description: All room codes are currently in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEntryProblem"
  /rooms/{code}:
    get:
      operationId: getRoom
      tags: [sweetest-scoop]
      summary: Get current room state
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: Room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
        "404":
          description: Room not found
  /rooms/{code}/players:
    post:
      operationId: joinRoom
      tags: [sweetest-scoop]
      summary: Join a room as a guest
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomInput"
      responses:
        "201":
          description: Player joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRoom"
        "400":
          description: Invalid room code, display name, or appearance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEntryProblem"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEntryProblem"
        "409":
          description: Display name already in use in this room, or game already started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomEntryProblem"
  /rooms/{code}/questions:
    put:
      operationId: updateQuestions
      tags: [sweetest-scoop]
      summary: Replace the room's prompts before starting
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionListInput"
      responses:
        "200":
          description: Questions saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
  /rooms/{code}/start:
    post:
      operationId: startGame
      tags: [sweetest-scoop]
      summary: Start the game
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: Game started, or current room state if already started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
  /rooms/{code}/answer:
    put:
      operationId: submitAnswer
      tags: [sweetest-scoop]
      summary: Lock one answer for the timed round
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInput"
      responses:
        "200":
          description: Answer saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
  /rooms/{code}/reveal:
    post:
      operationId: revealAnswers
      tags: [sweetest-scoop]
      summary: Reveal grouped answers and score the round
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/SessionToken"
      responses:
        "200":
          description: Answers revealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
  /rooms/{code}/next:
    post:
      operationId: nextQuestion
      tags: [sweetest-scoop]
      summary: Advance to the next question or finish
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoundAdvanceInput"
      responses:
        "200":
          description: Round advanced, or current room state if that round was already advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
        "400":
          description: Missing or invalid round number
        "409":
          description: The requested round has not reached results
  /rooms/{code}/profile:
    put:
      operationId: updateProfile
      tags: [sweetest-scoop]
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Bobi appearance saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
  /rooms/{code}/recap:
    get:
      operationId: getFinalRecap
      tags: [sweetest-scoop]
      summary: Get the authenticated guest's shareable final score
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - name: X-Session-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: This guest's final score and read-only share reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalRecap"
        "401":
          description: No active guest session
        "403":
          description: Hosts do not have a personal score
        "409":
          description: The game has not finished
  /results:
    get:
      operationId: getSharedRecap
      tags: [sweetest-scoop]
      summary: Read a final score using its share reference, without a seat session
      parameters:
        - name: X-Result-Ref
          in: header
          required: true
          schema: { $ref: "#/components/schemas/RecapReference" }
      responses:
        "200":
          description: Anonymous score and chronological round outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreRecap"
        "400":
          description: Invalid share link format
        "404":
          description: The recap has expired or is not available
  /rooms/{code}/settings:
    put:
      operationId: updateSettings
      tags: [sweetest-scoop]
      parameters:
        - $ref: "#/components/parameters/RoomCode"
        - $ref: "#/components/parameters/SessionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Round duration saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
components:
  parameters:
    RoomCode:
      name: code
      in: path
      required: true
      description: Short code on the host screen. Previously issued codes and links remain valid.
      schema:
        type: string
        pattern: '^(?:[A-Za-z]{2,3}|[0-9]{4}|[A-Za-z0-9]{6})$(?![\s\S])'
    SessionToken:
      name: X-Session-Token
      in: header
      required: false
      schema:
        type: string
  schemas:
    RecapReference:
      type: string
      description: A read-only capability separate from room codes and seat credentials.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.[A-Za-z0-9_-]{43}$(?![\s\S])'
    RecapOutcome:
      type: string
      enum: [golden-mango, coconut-cloud, pomelo-gem, mango-cube, sago-pearl, skipped]
    ScoreRecap:
      type: object
      required: [totalPoints, rounds]
      properties:
        totalPoints: { type: integer, minimum: 0 }
        rounds:
          description: One outcome per question, in the order the questions were played.
          type: array
          items: { $ref: "#/components/schemas/RecapOutcome" }
    FinalRecap:
      type: object
      required: [reference, recap]
      properties:
        reference: { $ref: "#/components/schemas/RecapReference" }
        recap: { $ref: "#/components/schemas/ScoreRecap" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BobiAppearance:
      type: string
      maxLength: 16
      pattern: '^(mango|matcha|strawberry|taro|coconut|b1:([0-9]|1[01]):([0-9]|1[0-9]|2[01]):([0-9]|1[0-9]|2[0-3]):([0-9]|1[0-3]))$(?![\s\S])'
      description: Legacy flavor preset or a versioned mix-and-match Bobi token. b1 encodes fixed color, hat, outfit and accessory indices; existing indices must never be reordered.
    CreateRoomInput:
      type: object
      required: [hostName]
      properties:
        hostName: { type: string, minLength: 1, maxLength: 32 }
        avatar: { $ref: "#/components/schemas/BobiAppearance" }
        customQuestionsTsv:
          type: string
          maxLength: 16000
          description: Optional pasted spreadsheet rows for a custom room, using Question, Answer and Dessert tier columns.
    JoinRoomInput:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 32
          description: Unique within the room after ignoring case and extra spaces.
        avatar: { $ref: "#/components/schemas/BobiAppearance" }
        inviteRoomId:
          $ref: "#/components/schemas/RoomInstanceId"
          description: When joining from a QR invite, require the current room to be this exact instance.
    RoomInstanceId:
      type: string
      format: uuid
      description: Immutable room identifier. It is not a session credential.
    RoomEntryProblem:
      type: object
      required: [error]
      properties:
        error: { type: string }
        field: { type: string, enum: [name, code] }
        issues:
          type: array
          items: { $ref: "#/components/schemas/CustomQuestionIssue" }
    CustomQuestionIssue:
      type: object
      required: [message]
      properties:
        row: { type: integer, minimum: 1 }
        message: { type: string }
    ProfileInput:
      type: object
      required: [avatar]
      properties:
        avatar: { $ref: "#/components/schemas/BobiAppearance" }
    SettingsInput:
      type: object
      required: [roundDuration]
      properties:
        roundDuration: { type: integer, enum: [25] }
    QuestionListInput:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 280 }
    AnswerInput:
      type: object
      required: [answer, round]
      properties:
        answer: { type: string, minLength: 1, maxLength: 120 }
        round: { type: integer, minimum: 1, maximum: 10 }
    RoundAdvanceInput:
      type: object
      required: [round]
      properties:
        round:
          type: integer
          minimum: 1
          maximum: 10
          description: The revealed round displayed when the host clicked Next or Final standings.
    PracticeAnswerInput:
      type: object
      required: [answer, round, elapsedMs]
      properties:
        answer: { type: string, minLength: 1, maxLength: 120 }
        round: { type: integer, minimum: 1, maximum: 10 }
        elapsedMs: { type: integer, minimum: 0, maximum: 25000 }
    SessionRoom:
      type: object
      required: [sessionToken, room]
      properties:
        sessionToken: { type: string }
        room: { $ref: "#/components/schemas/RoomState" }
    RoomState:
      type: object
      required: [code, phase, round, questionCount, questions, players, answers, standings, isHost, submitted, myTotalPoints]
      properties:
        code: { type: string }
        phase: { type: string, enum: [lobby, answering, revealed, finished] }
        round: { type: integer, minimum: 0, maximum: 10 }
        questionCount: { type: integer }
        serverNow: { type: string }
        roundStartedAt: { type: ["string", "null"] }
        roundEndsAt: { type: ["string", "null"] }
        roundDuration: { type: integer }
        playerId: { type: ["string", "null"] }
        roomInstanceId:
          $ref: "#/components/schemas/RoomInstanceId"
          description: Included for a verified seat, so invite links cannot resume an unrelated room with the same code.
        myAnswer: { type: ["string", "null"] }
        myTotalPoints:
          type: integer
          minimum: 0
          description: Private cumulative score of the authenticated player, including their current locked answer. Zero for a moderator or anonymous viewer.
        myReward:
          anyOf:
            - $ref: "#/components/schemas/AnswerReward"
            - type: "null"
        roundStandings:
          type: array
          items: { $ref: "#/components/schemas/Standing" }
        possibleAnswers:
          type: array
          items: { $ref: "#/components/schemas/CatalogAnswer" }
        questions:
          description: Custom rooms expose only prompts played so far to verified seats; party rooms keep their original behavior.
          type: array
          items: { type: string }
        currentQuestion: { type: ["string", "null"] }
        players:
          type: array
          items: { $ref: "#/components/schemas/RoomPlayer" }
        answers:
          type: array
          items: { $ref: "#/components/schemas/GroupedAnswer" }
        standings:
          type: array
          items: { $ref: "#/components/schemas/Standing" }
        honorableMentions:
          type: array
          description: Awards from all rounds, available only to room members once the game finishes.
          items: { $ref: "#/components/schemas/HonorableMention" }
        isHost: { type: boolean }
        avatar: { type: string }
        submitted: { type: boolean }
        submittedCount: { type: integer }
        answerFeedback:
          type: string
          description: Normal feedback for an unlisted answer, returned only by submission. No answer is saved or locked.
        answerCorrection:
          $ref: "#/components/schemas/AnswerCorrection"
    AnswerCorrection:
      type: object
      description: A private spelling suggestion. Submit the corrected answer again to confirm; no answer or points have been saved.
      required: [originalAnswer, correctedAnswer]
      properties:
        originalAnswer: { type: string }
        correctedAnswer: { type: string }
    AnswerReward:
      type: object
      required: [points, basePoints, speedBonus, tier, ingredient, depth, matched, elapsedMs]
      properties:
        points: { type: integer }
        basePoints: { type: integer }
        speedBonus: { type: integer }
        tier: { type: string }
        ingredient: { type: string }
        depth: { type: integer }
        matched: { type: boolean }
        elapsedMs: { type: integer }
        canonicalAnswer:
          type: string
          description: The accepted prepared answer, for displaying its correct spelling.
        answerCorrection:
          $ref: "#/components/schemas/AnswerCorrection"
    CatalogAnswer:
      type: object
      required: [answer, tier, basePoints, depth]
      properties:
        answer: { type: string }
        tier: { type: string }
        basePoints: { type: integer }
        depth: { type: integer }
        submitted: { type: boolean }
        submittedCount: { type: integer }
    RoomPlayer:
      type: object
      required: [id, displayName, isHost]
      properties:
        id: { type: string }
        displayName: { type: string }
        isHost: { type: boolean }
        avatar: { type: string }
        hasAnswered:
          type: boolean
          description: Whether this player has locked an answer in the current round. Does not expose answer content or score.
    GroupedAnswer:
      type: object
      required: [answer, players, count, points, tier, ingredient]
      properties:
        answer: { type: string }
        players:
          type: array
          items: { type: string }
        count: { type: integer }
        points: { type: integer, minimum: 0, maximum: 120 }
        tier: { type: string }
        ingredient: { type: string }
    HonorableMention:
      type: object
      required: [category, playerId, displayName, value]
      properties:
        category: { type: string, enum: [fastest, just-in-time, rare-finds] }
        playerId: { type: string }
        displayName: { type: string }
        avatar: { type: string }
        value:
          type: integer
          minimum: 0
          description: Elapsed milliseconds for reply awards, or number of top-two-tier answers for rare finds.
    Standing:
      type: object
      required: [playerId, displayName, points, discoveries]
      properties:
        playerId: { type: string }
        displayName: { type: string }
        points: { type: integer }
        discoveries: { type: integer }
        avatar: { type: string }
        answer: { type: ["string", "null"] }
        basePoints: { type: integer }
        speedBonus: { type: integer }
        elapsedMs: { type: ["integer", "null"] }

